
<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flughafen Live-Abflug & Plan-Manager</title>
  <style>
    :root{
      --bg:#f4f9ff;--card:#ffffff;--soft:#eaf4ff;--line:#d8e7f5;--text:#102033;--muted:#60758a;
      --blue:#0ea5e9;--blue2:#0284c7;--green:#16a34a;--amber:#f59e0b;--red:#dc2626;--violet:#7c3aed;--slate:#475569;
      --shadow:0 14px 36px rgba(14,79,120,.11);--radius:22px
    }
    *{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--text);background:linear-gradient(135deg,#eef8ff,#fff 38%,#eef2ff);min-height:100vh}
    button,input,select,textarea{font:inherit} button{cursor:pointer;border:0}.hidden{display:none!important}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.small{font-size:12px}.muted{color:var(--muted)}
    .app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.sidebar{background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border-right:1px solid var(--line);padding:22px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;gap:12px;align-items:center;margin-bottom:22px}.logo{width:48px;height:48px;border-radius:18px;background:linear-gradient(135deg,var(--blue),#6366f1);display:grid;place-items:center;color:white;font-size:26px;box-shadow:var(--shadow)}.brand h1{font-size:19px;margin:0}.brand p{margin:2px 0 0}.nav{display:grid;gap:8px}.nav button{display:flex;align-items:center;gap:10px;text-align:left;padding:13px 14px;border-radius:16px;background:transparent;color:#2c4258}.nav button:hover{background:var(--soft)}.nav button.active{background:var(--blue);color:white;box-shadow:0 8px 18px rgba(14,165,233,.24)}.main{padding:26px;overflow:hidden}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:22px}.title h2{font-size:34px;margin:0 0 6px}.pill{display:inline-flex;gap:8px;align-items:center;padding:7px 12px;border-radius:999px;background:#e0f2fe;color:#0369a1;font-weight:700;font-size:13px}.loginbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.grid{display:grid;gap:16px}.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}.cols4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:rgba(255,255,255,.9);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--radius);padding:18px}.card h3{margin:0 0 12px;font-size:22px}.stat{display:flex;justify-content:space-between;align-items:center}.stat strong{font-size:30px}.btn{border-radius:15px;padding:11px 14px;background:#eef6ff;color:#075985;font-weight:800}.btn:hover{filter:brightness(.98)}.btn.primary{background:var(--blue);color:#fff}.btn.green{background:var(--green);color:#fff}.btn.red{background:#fee2e2;color:#991b1b}.btn.amber{background:#fef3c7;color:#92400e}.btn.violet{background:#ede9fe;color:#5b21b6}.btn.gray{background:#f1f5f9;color:#334155}.btn.full{width:100%}.btn:disabled{opacity:.45;cursor:not-allowed}.input,.select,.textarea{width:100%;border:1px solid var(--line);border-radius:15px;padding:11px 12px;background:#fff;color:var(--text);outline:none}.textarea{min-height:110px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.formgrid .wide{grid-column:1/-1}.label{display:grid;gap:6px;font-weight:800}.label span{font-size:13px;color:#40566c}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.space{height:14px}.section{display:none}.section.active{display:block}.table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;border-radius:18px;border:1px solid var(--line);background:white}.table th{background:#102033;color:#fff;text-align:left;font-size:13px;padding:12px}.table td{padding:12px;border-top:1px solid var(--line);vertical-align:middle}.table tr:hover td{background:#f8fbff}.status{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900;border:1px solid}.st-ok{background:#dcfce7;color:#166534;border-color:#bbf7d0}.st-board{background:#dbeafe;color:#1d4ed8;border-color:#bfdbfe}.st-del{background:#fef3c7;color:#92400e;border-color:#fde68a}.st-cancel{background:#fee2e2;color:#991b1b;border-color:#fecaca}.st-gate{background:#ffedd5;color:#9a3412;border-color:#fed7aa}.st-closed{background:#e2e8f0;color:#334155;border-color:#cbd5e1}.notice{padding:13px;border-radius:16px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}.oknotice{padding:13px;border-radius:16px;background:#ecfdf5;border:1px solid #bbf7d0;color:#166534}.danger{padding:13px;border-radius:16px;background:#fef2f2;border:1px solid #fecaca;color:#991b1b}.tabs{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:8px 11px;border-radius:999px;background:#f1f5f9;color:#334155;font-weight:800}.chip.on{background:var(--blue);color:white}.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;place-items:center;padding:20px;z-index:10}.modal.show{display:grid}.modalbox{background:white;border-radius:28px;box-shadow:0 30px 70px rgba(0,0,0,.22);max-width:900px;width:100%;max-height:90vh;overflow:auto;padding:22px}.flightimg{width:80px;height:54px;object-fit:cover;border-radius:12px;background:#e2e8f0}.hero{border-radius:30px;padding:28px;background:linear-gradient(135deg,#dff3ff,#fff,#eef2ff);border:1px solid var(--line);box-shadow:var(--shadow)}.monitor{background:#08111f;color:#e5f6ff;border-radius:24px;padding:18px}.monitor .table{background:#0b1220;border-color:#1e3a5f}.monitor th{background:#0ea5e9}.monitor td{border-color:#1e3a5f}.monitor tr:hover td{background:#111c31}.footer-note{margin-top:12px;color:#6b7f93;font-size:12px}.badge{background:#eef2ff;color:#3730a3;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:900}.publicOnly,.adminOnly{}@media(max-width:980px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.cols2,.cols3,.cols4,.formgrid{grid-template-columns:1fr}.topbar{flex-direction:column}.table{display:block;overflow:auto}.main{padding:16px}.title h2{font-size:28px}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">✈</div><div><h1>Airport Manager</h1><p class="muted small">Live-Abflug, Pläne, Regeln</p></div></div>
    <div class="nav" id="nav"></div>
    <div class="space"></div>
    <div class="card">
      <div class="small muted">Login-Status</div>
      <strong id="loginState">Öffentliche Ansicht</strong>
      <div class="space"></div>
      <button class="btn primary full" id="loginBtn">Login</button>
      <button class="btn gray full hidden" id="logoutBtn">Logout</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="title"><span class="pill">🛫 Helles Flughafen-Informationssystem</span><h2 id="pageTitle">Startseite</h2><p class="muted" id="subtitle">Öffentliche Anzeige und geschützter Adminbereich.</p></div>
      <div class="loginbox">
        <span class="badge" id="activePlanBadge">Kein aktiver Plan</span>
        <span class="badge" id="clockBadge">--:--:--</span>
      </div>
    </div>

    <section id="home" class="section active"></section>
    <section id="live" class="section"></section>
    <section id="plans" class="section"></section>
    <section id="assistant" class="section"></section>
    <section id="editor" class="section"></section>
    <section id="airlines" class="section"></section>
    <section id="destinations" class="section"></section>
    <section id="gates" class="section"></section>
    <section id="scenarios" class="section"></section>
    <section id="info" class="section"></section>
    <section id="media" class="section"></section>
    <section id="monitor" class="section"></section>
    <section id="settings" class="section"></section>
  </main>
</div>

<div class="modal" id="modal"><div class="modalbox"><div class="row" style="justify-content:space-between"><h3 id="modalTitle">Dialog</h3><button class="btn gray" onclick="closeModal()">Schließen</button></div><div id="modalBody"></div></div></div>

<script>
const DAYS=["Mo","Di","Mi","Do","Fr","Sa","So"];
const STATUSES=["pünktlich","Boarding","Letzter Aufruf","Gate geöffnet","Gate geschlossen","verspätet","Gate geändert","umgeleitet","gestrichen","teilweise gestrichen","Notfall","abgeflogen"];
const DEFAULT_PASSWORD="admin";
const RECOVERY_CODE="1234";
const LS="airport_manager_full_v1";
const seedPlan={
  id:uid(),name:"Demo Sommerflugplan",airport:"Demo Airport",activeMode:"infinite",activeDays:{},createdAt:nowISO(),updatedAt:nowISO(),
  publicNote:"Willkommen am Demo Airport. Bitte prüfen Sie Ihre Abflugzeit regelmäßig.",
  settings:{refreshSeconds:60,hidePastAfterMin:30,activeUntil:"",activeWeekdays:DAYS,operating:{Mo:["05:00","23:00"],Di:["05:00","23:00"],Mi:["05:00","23:00"],Do:["05:00","23:00"],Fr:["04:30","23:30"],Sa:["04:00","23:30"],So:["05:00","22:30"]}},
  airlines:[
    {id:uid(),name:"Lufthansa",logo:"",info:"Deutsche Netzwerk-Airline mit vielen innerdeutschen und europäischen Verbindungen."},
    {id:uid(),name:"Eurowings",logo:"",info:"Point-to-point-Flüge und Ferienziele."},
    {id:uid(),name:"Condor",logo:"",info:"Ferienfluggesellschaft mit touristischen Zielen."},
    {id:uid(),name:"KLM",logo:"",info:"Verbindungen über Amsterdam."}
  ],
  destinations:[
    {id:uid(),name:"München",days:["Mo","Di","Mi","Do","Fr"],flightsPerDay:4,airlineWeights:{Lufthansa:70,Eurowings:30},image:""},
    {id:uid(),name:"Hamburg",days:["Mo","Mi","Fr","So"],flightsPerDay:2,airlineWeights:{Eurowings:100},image:""},
    {id:uid(),name:"Palma de Mallorca",days:["Fr","Sa","So"],flightsPerDay:5,airlineWeights:{Condor:55,Eurowings:45},image:""},
    {id:uid(),name:"Amsterdam",days:["Mo","Di","Mi","Do","Fr","Sa","So"],flightsPerDay:3,airlineWeights:{KLM:100},image:""}
  ],
  gates:[
    {id:uid(),name:"A1",terminal:"A",type:"Schengen",exclusiveAirlines:["Lufthansa"],shared:true,emergencyOnly:false,minTurnaround:20},
    {id:uid(),name:"A2",terminal:"A",type:"Schengen",exclusiveAirlines:["Lufthansa"],shared:true,emergencyOnly:false,minTurnaround:20},
    {id:uid(),name:"B1",terminal:"B",type:"Standard",exclusiveAirlines:["Eurowings"],shared:true,emergencyOnly:false,minTurnaround:20},
    {id:uid(),name:"C1",terminal:"C",type:"Charter",exclusiveAirlines:["Condor"],shared:true,emergencyOnly:false,minTurnaround:25},
    {id:uid(),name:"D9",terminal:"D",type:"Notfall",exclusiveAirlines:[],shared:false,emergencyOnly:true,minTurnaround:0}
  ],
  rules:{allowedMinutes:["05","10","15","20","25","30","35","40","45","50","55"],hourCounts:{"05":2,"06":4,"07":6,"08":5,"09":3,"10":3,"11":2,"12":3,"13":3,"14":4,"15":5,"16":5,"17":6,"18":4,"19":3,"20":2,"21":1,"22":1},gateExclusive:true,allowShared:true,emergencyGateNames:["D9"]},
  infoPages:[
    {id:uid(),title:"Sicherheitskontrolle",text:"Bitte halten Sie Bordkarte und Reisedokumente bereit. Flüssigkeiten nur nach geltenden Regeln mitführen.",image:"",priority:"normal"},
    {id:uid(),title:"Gatesituation",text:"Bei kurzfristigen Gatewechseln achten Sie bitte auf die Ansagen und Anzeigen im Terminal.",image:"",priority:"hoch"}
  ],
  flights:[
    {id:uid(),time:"06:20",airline:"Lufthansa",flightNo:"LH 2101",destination:"München",gate:"A1",terminal:"A",status:"pünktlich",delay:0,aircraft:"A320",days:["Mo","Di","Mi","Do","Fr"],image:"",infoPageId:null,reason:"",checkin:"04:20",boarding:"05:50"},
    {id:uid(),time:"07:05",airline:"Eurowings",flightNo:"EW 9044",destination:"Hamburg",gate:"B1",terminal:"B",status:"Boarding",delay:0,aircraft:"A319",days:["Mo","Mi","Fr","So"],image:"",infoPageId:null,reason:"",checkin:"05:05",boarding:"06:35"},
    {id:uid(),time:"08:35",airline:"Condor",flightNo:"DE 1512",destination:"Palma de Mallorca",gate:"C1",terminal:"C",status:"verspätet",delay:25,aircraft:"A321",days:["Fr","Sa","So"],image:"",infoPageId:null,reason:"Gatesituation",checkin:"06:35",boarding:"08:05"},
    {id:uid(),time:"09:10",airline:"KLM",flightNo:"KL 1830",destination:"Amsterdam",gate:"A2",terminal:"A",status:"pünktlich",delay:0,aircraft:"E190",days:["Mo","Di","Mi","Do","Fr","Sa","So"],image:"",infoPageId:null,reason:"",checkin:"07:10",boarding:"08:40"}
  ],
  scenarios:[]

};
let state=loadState();
let session={loggedIn:false};
let tempAssistant=null;

function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function nowISO(){return new Date().toISOString()}
function todayDay(){return DAYS[(new Date().getDay()+6)%7]}
function save(){localStorage.setItem(LS,JSON.stringify(state));renderAll()}
function loadState(){try{const s=JSON.parse(localStorage.getItem(LS));if(s&&s.plans)return s}catch(e){} return {password:DEFAULT_PASSWORD,recoveryCode:RECOVERY_CODE,rememberLogin:false,activePlanId:seedPlan.id,plans:[seedPlan],trash:[],media:[]}}
function activePlan(){return state.plans.find(p=>p.id===state.activePlanId)||state.plans[0]}
function isAdmin(){return session.loggedIn||localStorage.getItem(LS+"_remember")==="yes"}
function planById(id){return state.plans.find(p=>p.id===id)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function download(name,data,type="application/json"){const blob=new Blob([data],{type});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
function parseList(v){return (v||"").split(/[,,\n;]/).map(x=>x.trim()).filter(Boolean)}
function statusClass(s){if(["gestrichen","teilweise gestrichen"].includes(s))return"st-cancel";if(["verspätet","umgeleitet"].includes(s))return"st-del";if(["Gate geändert"].includes(s))return"st-gate";if(["Boarding","Letzter Aufruf","Gate geöffnet"].includes(s))return"st-board";if(["Gate geschlossen","abgeflogen"].includes(s))return"st-closed";return"st-ok"}
function setTitle(t,sub){document.getElementById("pageTitle").textContent=t;document.getElementById("subtitle").textContent=sub||""}
function esc(s){return String(s??"").replace(/[&<>'"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[m]))}
function weightedChoice(weights){const entries=Object.entries(weights||{}).filter(([k,v])=>Number(v)>0);if(!entries.length)return"";let sum=entries.reduce((a,[,v])=>a+Number(v),0),r=Math.random()*sum;for(const [k,v]of entries){r-=Number(v);if(r<=0)return k}return entries[0][0]}
function addMinutes(hhmm,min){let [h,m]=hhmm.split(":").map(Number);let d=new Date();d.setHours(h,m+min,0,0);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function timeToMin(t){const[a,b]=t.split(":").map(Number);return a*60+b}
function dayFlights(plan,day=todayDay(),includePast=true){let arr=plan.flights.filter(f=>f.days.includes(day)); if(!includePast){const now=new Date();const nowm=now.getHours()*60+now.getMinutes();const hide=Number(plan.settings?.hidePastAfterMin??30);arr=arr.filter(f=>["gestrichen","teilweise gestrichen","verspätet"].includes(f.status)||timeToMin(f.time)+hide>=nowm)} return arr.sort((a,b)=>a.time.localeCompare(b.time))}
function assignGate(plan,airline,time,day){const gates=plan.gates.filter(g=>!g.emergencyOnly && (!plan.rules.gateExclusive || !g.exclusiveAirlines.length || g.exclusiveAirlines.includes(airline))); const flights=plan.flights.filter(f=>f.days.includes(day)); for(const g of gates){const conflict=flights.some(f=>f.gate===g.name && Math.abs(timeToMin(f.time)-timeToMin(time)) < (g.minTurnaround||20)); if(!conflict)return g.name} return gates[0]?.name||"Wartet"}

function navItems(){const base=[['home','🏠 Startseite'],['live','✈️ Live-Abflugplan'],['airlines','🏢 Airlines'],['info','📰 Infoseiten'],['assistant','🧭 Plan erstellen']]; const admin=[['plans','💾 Plan-Center'],['editor','📅 Flugplan-Editor'],['destinations','🌍 Ziele'],['gates','🚪 Gates & Regeln'],['scenarios','⚠️ Szenarien'],['media','🖼 Medien'],['monitor','🖥 Monitor-Modus'],['settings','⚙️ Einstellungen']]; return isAdmin()?[...base,...admin]:base}
function show(id){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));renderSection(id)}
function renderNav(){document.getElementById('nav').innerHTML=navItems().map(([id,label])=>`<button data-id="${id}" onclick="show('${id}')">${label}</button>`).join('')}
function renderAll(){renderNav();document.getElementById('loginState').textContent=isAdmin()?"Admin angemeldet":"Öffentliche Ansicht";document.getElementById('loginBtn').classList.toggle('hidden',isAdmin());document.getElementById('logoutBtn').classList.toggle('hidden',!isAdmin());document.getElementById('activePlanBadge').textContent=activePlan()?"Live: "+activePlan().name:"Kein aktiver Plan";const active=document.querySelector('.section.active')?.id||'home';renderSection(active)}
function renderSection(id){if(id==='home')renderHome();if(id==='live')renderLive();if(id==='plans')renderPlans();if(id==='assistant')renderAssistant();if(id==='editor')renderEditor();if(id==='airlines')renderAirlines();if(id==='destinations')renderDestinations();if(id==='gates')renderGates();if(id==='scenarios')renderScenarios();if(id==='info')renderInfo();if(id==='media')renderMedia();if(id==='monitor')renderMonitor();if(id==='settings')renderSettings()}

function renderHome(){setTitle('Startseite','Übersicht, Live-Lage und schnelle Aktionen.');const p=activePlan();const flights=p?dayFlights(p,todayDay(),false):[];const delayed=flights.filter(f=>f.status==='verspätet').length,cancel=flights.filter(f=>f.status.includes('gestrichen')).length;document.getElementById('home').innerHTML=`<div class="hero"><h3>${esc(p?.airport||'Airport')}</h3><p>${esc(p?.publicNote||'')}</p><div class="row"><button class="btn primary" onclick="show('live')">Live-Abflug öffnen</button><button class="btn" onclick="show('assistant')">Eigenen Plan erstellen</button>${isAdmin()?'<button class="btn green" onclick="show(\'plans\')">Plan-Center</button>':''}</div></div><div class="space"></div><div class="grid cols4"><div class="card stat"><span>Heutige Flüge</span><strong>${flights.length}</strong></div><div class="card stat"><span>Verspätungen</span><strong>${delayed}</strong></div><div class="card stat"><span>Ausfälle</span><strong>${cancel}</strong></div><div class="card stat"><span>Aktualisierung</span><strong>${p?.settings?.refreshSeconds||60}s</strong></div></div><div class="space"></div><div class="grid cols2"><div class="card"><h3>Öffentlich möglich</h3><p>Live-Abflug ansehen, Airlines und Infoseiten öffnen, eigene unabhängige Pläne erstellen und herunterladen.</p></div><div class="card"><h3>Nach Login möglich</h3><p>Aktiven Live-Plan ersetzen, löschen, bearbeiten, Flüge streichen, Szenarien aktivieren und Passwort ändern.</p></div></div>`}

function renderLive(){setTitle('Live-Abflugplan','Aktiver Plan des Airports. Aktualisiert automatisch und vergangene Flüge verschwinden nach Einstellung.');const p=activePlan();if(!p){document.getElementById('live').innerHTML='<div class="danger">Kein Plan vorhanden.</div>';return}const day=todayDay();const rows=dayFlights(p,day,false).map(f=>flightRow(f,p,true)).join('')||`<tr><td colspan="9">Keine Flüge aktuell sichtbar.</td></tr>`;document.getElementById('live').innerHTML=`<div class="row" style="justify-content:space-between"><div class="tabs">${DAYS.map(d=>`<span class="chip ${d===day?'on':''}">${d}</span>`).join('')}</div><div class="row"><button class="btn" onclick="renderLive()">Aktualisieren</button>${isAdmin()?'<button class="btn green" onclick="show(\'editor\')">Flug bearbeiten</button>':''}</div></div><div class="space"></div><div class="card"><div class="row" style="justify-content:space-between"><h3>${esc(p.name)}</h3><span class="muted">Letzte Aktualisierung: ${new Date().toLocaleTimeString('de-DE')}</span></div><table class="table"><thead><tr><th>Zeit</th><th>Airline</th><th>Flug</th><th>Ziel</th><th>Terminal</th><th>Gate</th><th>Status</th><th>Bild</th><th>Aktion</th></tr></thead><tbody>${rows}</tbody></table></div><div class="space"></div><div class="grid cols2"><div class="card"><h3>Aktuelle Hinweise</h3>${dayFlights(p,day,true).filter(f=>f.status!=='pünktlich').map(f=>`<div class="notice"><b>${esc(f.flightNo)}</b> ${esc(f.destination)}: ${esc(f.status)} ${f.reason?'wegen '+esc(f.reason):''}</div>`).join('<div class="space"></div>')||'<p class="muted">Keine besonderen Hinweise.</p>'}</div><div class="card"><h3>Plan-Laufzeit</h3><p><b>Modus:</b> ${esc(p.activeMode||'infinite')}</p><p class="muted">Unendlich, heutiger Tag, bestimmtes Datum oder Wochenplan sind im Plan-Center einstellbar.</p></div></div>`}
function flightRow(f,p,live=false){return`<tr onclick="openFlight('${f.id}')"><td><b>${esc(f.time)}</b>${f.delay?` <span class="small" style="color:#b45309">+${f.delay}</span>`:''}</td><td>${esc(f.airline)}</td><td>${esc(f.flightNo)}</td><td><b>${esc(f.destination)}</b></td><td>${esc(f.terminal||'')}</td><td>${esc(f.gate)}</td><td><span class="status ${statusClass(f.status)}">${esc(f.status)}</span>${f.reason?`<div class="small muted">${esc(f.reason)}</div>`:''}</td><td>${f.image?`${esc(f.image)}`:'—'}</td><td><button class="btn" onclick="event.stopPropagation();openFlight('${f.id}')">Info</button>${isAdmin()&&live?` <button class="btn red" onclick="event.stopPropagation();quickCancel('${f.id}')">Streichen</button>`:''}</td></tr>`}
function openFlight(id){const p=activePlan();const f=p.flights.find(x=>x.id===id);const page=p.infoPages.find(x=>x.id===f.infoPageId);openModal(`Flug ${esc(f.flightNo)}`,`<div class="grid cols2"><div><p><b>Zeit:</b> ${esc(f.time)} ${f.delay?`+${f.delay} Min`:''}</p><p><b>Airline:</b> ${esc(f.airline)}</p><p><b>Ziel:</b> ${esc(f.destination)}</p><p><b>Terminal/Gate:</b> ${esc(f.terminal||'')} / ${esc(f.gate)}</p><p><b>Status:</b> <span class="status ${statusClass(f.status)}">${esc(f.status)}</span></p><p><b>Check-in:</b> ${esc(f.checkin||'')}</p><p><b>Boarding:</b> ${esc(f.boarding||'')}</p><p><b>Flugzeug:</b> ${esc(f.aircraft||'')}</p></div><div>${f.image?`<img src="${esc(f.image)}" style="width:100%;border-radius:20px">`:''}<h3>${esc(page?.title||'Infoseite')}</h3><p>${esc(page?.text||'Keine Infoseite zugeordnet.')}</p></div></div>${isAdmin()?`<div class="space"></div><div class="row"><button class="btn amber" onclick="setFlightStatus('${id}','verspätet')">Verspätung</button><button class="btn red" onclick="quickCancel('${id}')">Streichen</button><button class="btn" onclick="closeModal();show('editor')">Im Editor öffnen</button></div>`:''}`)}
function quickCancel(id){const p=activePlan();const f=p.flights.find(x=>x.id===id);if(!isAdmin())return alert('Nur nach Login.');const reason=prompt('Grund für Streichung?',f.reason||'Gatesituation')||'';f.status='gestrichen';f.reason=reason;p.updatedAt=nowISO();save()}
function setFlightStatus(id,status){const p=activePlan();const f=p.flights.find(x=>x.id===id);const min=status==='verspätet'?Number(prompt('Verspätung Minuten?',f.delay||15)||15):f.delay;f.status=status;f.delay=min;f.reason=prompt('Grund / Hinweis?',f.reason||'Gatesituation')||'';save();closeModal()}

function renderPlans(){if(!isAdmin())return blocked('plans');setTitle('Plan-Center','Unabhängige Pläne verwalten, downloaden, löschen, importieren und live schalten.');document.getElementById('plans').innerHTML=`<div class="grid cols2"><div class="card"><h3>Gespeicherte Pläne</h3>${state.plans.map(p=>`<div class="card" style="box-shadow:none;margin-bottom:10px"><div class="row" style="justify-content:space-between"><div><b>${esc(p.name)}</b><div class="small muted">${esc(p.airport||'Airport')} · ${p.flights.length} Flüge · ${p.id===state.activePlanId?'LIVE':'nicht live'}</div></div><span class="badge">${esc(p.activeMode||'infinite')}</span></div><div class="space"></div><div class="row"><button class="btn primary" onclick="activatePlan('${p.id}')">Live schalten/ersetzen</button><button class="btn" onclick="downloadPlan('${p.id}')">Download</button><button class="btn violet" onclick="duplicatePlan('${p.id}')">Duplizieren</button><button class="btn red" onclick="deletePlan('${p.id}')">Löschen</button></div></div>`).join('')}</div><div class="card"><h3>Plan importieren / aktiven ersetzen</h3><textarea id="planImport" class="textarea mono" placeholder="Plan-JSON hier einfügen..."></textarea><div class="space"></div><div class="row"><button class="btn green" onclick="importPlan(false)">Als neuen Plan speichern</button><button class="btn amber" onclick="importPlan(true)">Aktiven Live-Plan ersetzen</button></div><div class="space"></div><h3>Laufzeit aktiver Plan</h3>${planRuntimeForm(activePlan())}</div></div><div class="space"></div><div class="card"><h3>Papierkorb</h3>${state.trash.length?state.trash.map(p=>`<div class="row" style="justify-content:space-between"><span>${esc(p.name)}</span><div><button class="btn" onclick="restorePlan('${p.id}')">Wiederherstellen</button><button class="btn red" onclick="purgePlan('${p.id}')">Endgültig löschen</button></div></div>`).join('<hr>'):'<p class="muted">Papierkorb leer.</p>'}</div>`}
function planRuntimeForm(p){if(!p)return'';return`<div class="formgrid"><label class="label"><span>Plan läuft</span><select id="runtimeMode" class="select"><option value="infinite" ${p.activeMode==='infinite'?'selected':''}>Unendlich bis neuer Plan</option><option value="today" ${p.activeMode==='today'?'selected':''}>Nur heute</option><option value="date" ${p.activeMode==='date'?'selected':''}>Bis Datum</option><option value="weekly" ${p.activeMode==='weekly'?'selected':''}>Wochenplan automatisch</option></select></label><label class="label"><span>Bis Datum</span><input id="runtimeDate" class="input" type="date" value="${esc(p.activeUntil||'')}"></label><label class="label wide"><span>Vergangene Flüge ausblenden nach Minuten</span><input id="hidePast" class="input" type="number" value="${p.settings?.hidePastAfterMin??30}"></label><button class="btn primary wide" onclick="saveRuntime()">Laufzeit speichern</button></div>`}
function saveRuntime(){const p=activePlan();p.activeMode=document.getElementById('runtimeMode').value;p.activeUntil=document.getElementById('runtimeDate').value;p.settings.hidePastAfterMin=Number(document.getElementById('hidePast').value||30);save()}
function activatePlan(id){state.activePlanId=id;save();alert('Plan ist jetzt live aktiv und ersetzt die Anzeige im Live-Abflugplan.')}function downloadPlan(id){const p=planById(id);download((p.name||'plan').replaceAll(' ','-')+'.json',JSON.stringify(p,null,2))}function duplicatePlan(id){const p=clone(planById(id));p.id=uid();p.name=p.name+' Kopie';state.plans.push(p);save()}function deletePlan(id){if(state.plans.length<=1)return alert('Mindestens ein Plan muss bleiben.');if(!confirm('Plan wirklich löschen?'))return;const i=state.plans.findIndex(p=>p.id===id);state.trash.push(state.plans[i]);state.plans.splice(i,1);if(state.activePlanId===id)state.activePlanId=state.plans[0].id;save()}function restorePlan(id){const i=state.trash.findIndex(p=>p.id===id);state.plans.push(state.trash[i]);state.trash.splice(i,1);save()}function purgePlan(id){state.trash=state.trash.filter(p=>p.id!==id);save()}function importPlan(replace){try{const parsed=JSON.parse(document.getElementById('planImport').value);if(!parsed.flights)throw Error('Kein Plan');parsed.id=replace?state.activePlanId:uid();parsed.updatedAt=nowISO();if(replace){const idx=state.plans.findIndex(p=>p.id===state.activePlanId);state.plans[idx]=parsed}else state.plans.push(parsed);save();alert('Plan importiert.')}catch(e){alert('Import nicht möglich. Bitte gültiges Plan-JSON einfügen.')}}

function renderAssistant(){setTitle('Plan-Assistent','Unabhängigen Plan mit Airlines, Zielen, Wochenplan, Minuten- und Stundenregeln erzeugen.');document.getElementById('assistant').innerHTML=`<div class="grid cols2"><div class="card"><h3>1. Grunddaten</h3><div class="formgrid"><label class="label"><span>Planname</span><input id="asName" class="input" value="Neuer automatisch erstellter Plan"></label><label class="label"><span>Flughafenname</span><input id="asAirport" class="input" value="Mein Airport"></label><label class="label"><span>Betriebsbeginn</span><input id="asStart" class="input" type="time" value="05:00"></label><label class="label"><span>Betriebsende</span><input id="asEnd" class="input" type="time" value="23:00"></label><label class="label wide"><span>Zulässige Airlines zuerst eingeben</span><textarea id="asAirlines" class="textarea">Lufthansa\nEurowings\nCondor\nKLM\nRyanair\nEasyJet</textarea></label><label class="label wide"><span>Ziele eingeben</span><textarea id="asDests" class="textarea">München\nHamburg\nPalma de Mallorca\nAmsterdam\nLondon\nParis\nAntalya</textarea></label></div></div><div class="card"><h3>2. Regeln</h3><div class="formgrid"><label class="label wide"><span>Erlaubte Minuten</span><input id="asMinutes" class="input" value="05,10,15,20,25,30,35,40,45,50,55"></label><label class="label wide"><span>Flüge pro Stunde, Format 05=2,06=4</span><textarea id="asHours" class="textarea mono">05=2\n06=4\n07=6\n08=5\n09=3\n10=3\n11=2\n12=3\n13=3\n14=4\n15=5\n16=5\n17=6\n18=4\n19=3\n20=2\n21=1\n22=1</textarea></label><label class="label wide"><span>Gates</span><textarea id="asGates" class="textarea">A1 Lufthansa\nA2 Lufthansa\nB1 Eurowings\nB2 Eurowings\nC1 Condor\nC2 Condor\nD9 NOTFALL</textarea></label><button class="btn primary wide" onclick="assistantBuildStep2()">Weiter: Ziele konfigurieren</button></div></div></div><div id="assistantStep2"></div>`}
function assistantBuildStep2(){const airlines=parseList(document.getElementById('asAirlines').value),dests=parseList(document.getElementById('asDests').value);tempAssistant={airlines,dests};document.getElementById('assistantStep2').innerHTML=`<div class="space"></div><div class="card"><h3>3. Wochenplan, Häufigkeiten und Airline-Anteile pro Ziel</h3><p class="muted">Pro Ziel auswählen, an welchen Tagen es fliegt und wie oft welche Airline dieses Ziel bedient. Werte können Prozent oder Anteile sein.</p>${dests.map((d,i)=>`<div class="card" style="box-shadow:none;margin-bottom:10px"><b>${esc(d)}</b><div class="formgrid"><label class="label"><span>Flüge pro aktivem Tag</span><input id="destCount${i}" class="input" type="number" value="3"></label><label class="label"><span>Airline-Gewichte</span><input id="destWeights${i}" class="input" value="${airlines.slice(0,2).map((a,j)=>a+'='+(j?40:60)).join(', ')}"></label><div class="wide row">${DAYS.map(day=>`<label class="chip on"><input type="checkbox" checked id="destDay${i}_${day}"> ${day}</label>`).join('')}</div></div></div>`).join('')}<div class="row"><button class="btn green" onclick="generateAssistantPlan(false)">Vorschau erzeugen</button><button class="btn violet" onclick="generateAssistantPlan(true)">Neu berechnen</button></div></div><div id="assistantPreview"></div>`}
function parseWeights(txt){const out={};parseList(txt).forEach(x=>{const[a,b]=x.split('=').map(v=>v.trim());if(a)out[a]=Number(b||1)});return out}
function parseHours(txt){const o={};txt.split(/\n|,/).forEach(line=>{const[a,b]=line.split('=').map(v=>v.trim());if(a)o[a.padStart(2,'0')]=Number(b||0)});return o}
function generateAssistantPlan(){const name=document.getElementById('asName').value,airport=document.getElementById('asAirport').value,start=document.getElementById('asStart').value,end=document.getElementById('asEnd').value;const allowedMinutes=parseList(document.getElementById('asMinutes').value).map(x=>x.padStart(2,'0'));const hourCounts=parseHours(document.getElementById('asHours').value);const airlines=parseList(document.getElementById('asAirlines').value).map(n=>({id:uid(),name:n,logo:'',info:'Automatisch angelegte Airline.'}));const gateLines=document.getElementById('asGates').value.split('\n').map(x=>x.trim()).filter(Boolean);const gates=gateLines.map(l=>{const parts=l.split(/\s+/);return{id:uid(),name:parts[0],terminal:parts[0][0]||'',type:l.includes('NOTFALL')?'Notfall':'Standard',exclusiveAirlines:l.includes('NOTFALL')?[]:parts.slice(1),shared:true,emergencyOnly:l.includes('NOTFALL'),minTurnaround:20}});let plan=clone(seedPlan);plan.id=uid();plan.name=name;plan.airport=airport;plan.airlines=airlines;plan.gates=gates;plan.flights=[];plan.destinations=[];plan.rules.allowedMinutes=allowedMinutes;plan.rules.hourCounts=hourCounts;plan.settings.operating=Object.fromEntries(DAYS.map(d=>[d,[start,end]]));plan.infoPages=[{id:uid(),title:'Allgemeine Reiseinformationen',text:'Dieser Plan wurde automatisch erstellt. Bitte Zeiten und Gates prüfen.',image:'',priority:'normal'}];tempAssistant.dests.forEach((d,i)=>{const days=DAYS.filter(day=>document.getElementById(`destDay${i}_${day}`).checked);const count=Number(document.getElementById(`destCount${i}`).value||1);const weights=parseWeights(document.getElementById(`destWeights${i}`).value);plan.destinations.push({id:uid(),name:d,days,flightsPerDay:count,airlineWeights:weights,image:''});days.forEach(day=>{for(let n=0;n<count;n++){const hours=Object.keys(hourCounts).filter(h=>Number(h)>=Number(start.slice(0,2))&&Number(h)<=Number(end.slice(0,2))&&hourCounts[h]>0);const hour=hours[Math.floor(Math.random()*hours.length)]||start.slice(0,2);const minute=allowedMinutes[Math.floor(Math.random()*allowedMinutes.length)]||'00';const time=hour+':'+minute;const airline=weightedChoice(weights)||airlines[0]?.name||'Airline';const gate=assignGate(plan,airline,time,day);const flightNo=(airline.slice(0,2).toUpperCase()+String(1000+Math.floor(Math.random()*8999)));plan.flights.push({id:uid(),time,airline,flightNo,destination:d,gate,terminal:gate[0]||'',status:'pünktlich',delay:0,aircraft:['A320','A319','B737','E190'][Math.floor(Math.random()*4)],days:[day],image:'',infoPageId:plan.infoPages[0].id,reason:'',checkin:addMinutes(time,-120),boarding:addMinutes(time,-30)})}})});const conflicts=findConflicts(plan);tempAssistant.plan=plan;document.getElementById('assistantPreview').innerHTML=`<div class="space"></div><div class="card"><h3>Vorschau: ${esc(plan.name)}</h3><p>${plan.flights.length} Flüge wurden erstellt.</p>${conflicts.length?`<div class="danger"><b>Konflikte:</b><br>${conflicts.map(esc).join('<br>')}</div>`:'<div class="oknotice">Keine offensichtlichen Konflikte gefunden.</div>'}<div class="space"></div><div class="row"><button class="btn violet" onclick="generateAssistantPlan()">Neu berechnen</button><button class="btn green" onclick="saveAssistantPlan(false)">Als unabhängigen Plan speichern</button><button class="btn primary" onclick="saveAssistantPlan(true)">Speichern und live schalten</button><button class="btn" onclick="download('assistant-plan.json',JSON.stringify(tempAssistant.plan,null,2))">Download</button></div><div class="space"></div><table class="table"><thead><tr><th>Tag</th><th>Zeit</th><th>Airline</th><th>Flug</th><th>Ziel</th><th>Gate</th></tr></thead><tbody>${plan.flights.slice(0,80).sort((a,b)=>a.days[0].localeCompare(b.days[0])||a.time.localeCompare(b.time)).map(f=>`<tr><td>${f.days[0]}</td><td>${f.time}</td><td>${esc(f.airline)}</td><td>${esc(f.flightNo)}</td><td>${esc(f.destination)}</td><td>${esc(f.gate)}</td></tr>`).join('')}</tbody></table></div>`}
function findConflicts(plan){const c=[];for(const day of DAYS){const arr=plan.flights.filter(f=>f.days.includes(day));for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++){if(arr[i].gate===arr[j].gate&&arr[i].time===arr[j].time)c.push(`${day}: Gate ${arr[i].gate} doppelt um ${arr[i].time}`)}}return c.slice(0,20)}function saveAssistantPlan(live){if(!tempAssistant?.plan)return;state.plans.push(tempAssistant.plan);if(live)state.activePlanId=tempAssistant.plan.id;save();alert(live?'Plan gespeichert und live geschaltet.':'Plan gespeichert.')}

function renderEditor(){if(!isAdmin())return blocked('editor');setTitle('Flugplan-Editor','Flüge im aktiven Plan erstellen, bearbeiten, löschen und Infoseiten zuordnen.');const p=activePlan();document.getElementById('editor').innerHTML=`<div class="grid cols2"><div class="card"><h3>Neuen Flug erstellen</h3>${flightForm()}</div><div class="card"><h3>Flüge aktiver Plan</h3><table class="table"><thead><tr><th>Zeit</th><th>Flug</th><th>Ziel</th><th>Status</th><th></th></tr></thead><tbody>${p.flights.sort((a,b)=>a.time.localeCompare(b.time)).map(f=>`<tr><td>${f.time}</td><td>${esc(f.flightNo)}</td><td>${esc(f.destination)}</td><td><span class="status ${statusClass(f.status)}">${esc(f.status)}</span></td><td><button class="btn" onclick="editFlight('${f.id}')">Bearbeiten</button> <button class="btn red" onclick="removeFlight('${f.id}')">Löschen</button></td></tr>`).join('')}</tbody></table></div></div>`}
function flightForm(f={}){const p=activePlan();return`<div class="formgrid"><input id="flId" type="hidden" value="${f.id||''}"><label class="label"><span>Zeit</span><input id="flTime" class="input" type="time" value="${f.time||'10:30'}"></label><label class="label"><span>Airline</span><input id="flAirline" class="input" value="${esc(f.airline||'')}"></label><label class="label"><span>Flugnummer</span><input id="flNo" class="input" value="${esc(f.flightNo||'')}"></label><label class="label"><span>Ziel</span><input id="flDest" class="input" value="${esc(f.destination||'')}"></label><label class="label"><span>Terminal</span><input id="flTerminal" class="input" value="${esc(f.terminal||'')}"></label><label class="label"><span>Gate</span><input id="flGate" class="input" value="${esc(f.gate||'')}"></label><label class="label"><span>Status</span><select id="flStatus" class="select">${STATUSES.map(s=>`<option ${f.status===s?'selected':''}>${s}</option>`).join('')}</select></label><label class="label"><span>Verspätung Minuten</span><input id="flDelay" class="input" type="number" value="${f.delay||0}"></label><label class="label"><span>Flugzeugtyp</span><input id="flAircraft" class="input" value="${esc(f.aircraft||'')}"></label><label class="label"><span>Grund/Hinweis</span><input id="flReason" class="input" value="${esc(f.reason||'')}"></label><label class="label wide"><span>Bild-URL</span><input id="flImage" class="input" value="${esc(f.image||'')}"></label><label class="label wide"><span>Infoseite</span><select id="flInfo" class="select"><option value="">Keine</option>${p.infoPages.map(pg=>`<option value="${pg.id}" ${f.infoPageId===pg.id?'selected':''}>${esc(pg.title)}</option>`).join('')}</select></label><div class="wide row">${DAYS.map(d=>`<label class="chip ${(f.days||[todayDay()]).includes(d)?'on':''}"><input type="checkbox" id="flDay_${d}" ${(f.days||[todayDay()]).includes(d)?'checked':''}> ${d}</label>`).join('')}</div><button class="btn primary wide" onclick="saveFlight()">Flug speichern</button></div>`}
function saveFlight(){const p=activePlan();const id=document.getElementById('flId').value;const obj={id:id||uid(),time:flTime.value,airline:flAirline.value,flightNo:flNo.value,destination:flDest.value,terminal:flTerminal.value,gate:flGate.value,status:flStatus.value,delay:Number(flDelay.value||0),aircraft:flAircraft.value,reason:flReason.value,image:flImage.value,infoPageId:flInfo.value||null,days:DAYS.filter(d=>document.getElementById('flDay_'+d).checked),checkin:addMinutes(flTime.value,-120),boarding:addMinutes(flTime.value,-30)};if(!obj.airline||!obj.flightNo||!obj.destination)return alert('Airline, Flugnummer und Ziel sind Pflicht.');const i=p.flights.findIndex(f=>f.id===id);if(i>=0)p.flights[i]=obj;else p.flights.push(obj);save()}function editFlight(id){const f=activePlan().flights.find(x=>x.id===id);document.querySelector('#editor .card').innerHTML='<h3>Flug bearbeiten</h3>'+flightForm(f)}function removeFlight(id){if(confirm('Flug löschen?')){const p=activePlan();p.flights=p.flights.filter(f=>f.id!==id);save()}}

function renderAirlines(){const p=activePlan();setTitle('Airlines / Gesellschaften','Öffentlich sichtbar, Bearbeitung nur nach Login.');document.getElementById('airlines').innerHTML=`<div class="grid cols3">${p.airlines.map(a=>`<div class="card"><h3>${esc(a.name)}</h3>${a.logo?`<img src="${esc(a.logo)}" style="width:100%;height:120px;object-fit:contain">`:''}<p>${esc(a.info||'')}</p>${isAdmin()?`<button class="btn red" onclick="deleteAirline('${a.id}')">Löschen</button>`:''}</div>`).join('')}</div>${isAdmin()?`<div class="space"></div><div class="card"><h3>Airline hinzufügen</h3><div class="formgrid"><input id="airName" class="input" placeholder="Name"><input id="airLogo" class="input" placeholder="Logo/Bild-URL"><textarea id="airInfo" class="textarea wide" placeholder="Info"></textarea><button class="btn primary wide" onclick="addAirline()">Speichern</button></div></div>`:''}`}
function addAirline(){activePlan().airlines.push({id:uid(),name:airName.value,logo:airLogo.value,info:airInfo.value});save()}function deleteAirline(id){activePlan().airlines=activePlan().airlines.filter(a=>a.id!==id);save()}
function renderDestinations(){if(!isAdmin())return blocked('destinations');setTitle('Ziele','Ziele, Tage und Airline-Häufigkeiten verwalten.');const p=activePlan();document.getElementById('destinations').innerHTML=`<div class="grid cols2">${p.destinations.map(d=>`<div class="card"><h3>${esc(d.name)}</h3><p>Tage: ${d.days.join(', ')} · ${d.flightsPerDay} Flüge/Tag</p><p class="muted">Airline-Anteile: ${Object.entries(d.airlineWeights||{}).map(([a,w])=>a+' '+w).join(', ')}</p><button class="btn red" onclick="deleteDest('${d.id}')">Löschen</button></div>`).join('')}</div><div class="space"></div><div class="card"><h3>Ziel hinzufügen</h3><div class="formgrid"><input id="destName" class="input" placeholder="Ziel"><input id="destCount" class="input" type="number" value="2"><input id="destWeights" class="input wide" placeholder="Lufthansa=60, Eurowings=40"><div class="wide row">${DAYS.map(d=>`<label class="chip on"><input type="checkbox" id="newDest_${d}" checked> ${d}</label>`).join('')}</div><button class="btn primary wide" onclick="addDest()">Speichern</button></div></div>`}
function addDest(){activePlan().destinations.push({id:uid(),name:destName.value,days:DAYS.filter(d=>document.getElementById('newDest_'+d).checked),flightsPerDay:Number(destCount.value||1),airlineWeights:parseWeights(destWeights.value),image:''});save()}function deleteDest(id){activePlan().destinations=activePlan().destinations.filter(d=>d.id!==id);save()}
function renderGates(){if(!isAdmin())return blocked('gates');setTitle('Gates & Regeln','Gate-Regeln, exklusive Airlines, geteilte Gates und Notfallgates.');const p=activePlan();document.getElementById('gates').innerHTML=`<div class="grid cols2"><div class="card"><h3>Gates</h3>${p.gates.map(g=>`<div class="card" style="box-shadow:none;margin-bottom:8px"><b>${esc(g.name)}</b> Terminal ${esc(g.terminal)} · ${esc(g.type)} ${g.emergencyOnly?'· Notfall':''}<p class="muted">Exklusiv/erlaubt: ${esc((g.exclusiveAirlines||[]).join(', ')||'alle')}</p><button class="btn red" onclick="deleteGate('${g.id}')">Löschen</button></div>`).join('')}</div><div class="card"><h3>Gate hinzufügen</h3><div class="formgrid"><input id="gateName" class="input" placeholder="A1"><input id="gateTerminal" class="input" placeholder="Terminal"><select id="gateType" class="select"><option>Standard</option><option>Schengen</option><option>Non-Schengen</option><option>Regional</option><option>VIP</option><option>Charter</option><option>Notfall</option></select><input id="gateAir" class="input" placeholder="Airlines Komma-getrennt"><label><input type="checkbox" id="gateShared" checked> geteiltes Gate</label><label><input type="checkbox" id="gateEmergency"> nur Notfall</label><button class="btn primary wide" onclick="addGate()">Gate speichern</button></div><div class="space"></div><h3>Globale Regeln</h3><label><input type="checkbox" id="ruleExclusive" ${p.rules.gateExclusive?'checked':''} onchange="activePlan().rules.gateExclusive=this.checked;save()"> Airline-Gate-Regeln beachten</label><br><label><input type="checkbox" id="ruleShared" ${p.rules.allowShared?'checked':''} onchange="activePlan().rules.allowShared=this.checked;save()"> Gates teilen erlauben</label></div></div>`}
function addGate(){activePlan().gates.push({id:uid(),name:gateName.value,terminal:gateTerminal.value,type:gateType.value,exclusiveAirlines:parseList(gateAir.value),shared:gateShared.checked,emergencyOnly:gateEmergency.checked,minTurnaround:20});save()}function deleteGate(id){activePlan().gates=activePlan().gates.filter(g=>g.id!==id);save()}
function renderScenarios(){if(!isAdmin())return blocked('scenarios');setTitle('Szenarien','Verspätungen, Flugausfälle, Gatesituation, Wetter und technische Probleme eintragen.');const p=activePlan();document.getElementById('scenarios').innerHTML=`<div class="grid cols2"><div class="card"><h3>Szenario anwenden</h3><div class="formgrid"><select id="scType" class="select"><option value="delay">Verspätung</option><option value="cancel">Flugausfall</option><option value="gate">Gate ändern</option><option value="weather">Wetterereignis</option></select><input id="scFlight" class="input" placeholder="Flugnummer oder leer für alle"><input id="scMinutes" class="input" type="number" value="15"><input id="scReason" class="input" value="Gatesituation"><button class="btn amber wide" onclick="applyScenario()">Anwenden</button></div></div><div class="card"><h3>Aktive Ereignisse</h3>${p.scenarios.length?p.scenarios.map(s=>`<div class="notice">${esc(s.type)} · ${esc(s.reason)} · ${esc(s.createdAt)}</div>`).join('<div class="space"></div>'):'<p class="muted">Keine Szenarien aktiv.</p>'}</div></div>`}
function applyScenario(){const p=activePlan();const type=scType.value,flight=scFlight.value.toLowerCase(),reason=scReason.value,min=Number(scMinutes.value||0);p.flights=p.flights.map(f=>{if(flight&&f.flightNo.toLowerCase()!==flight)return f;if(type==='cancel')return{...f,status:'gestrichen',reason};if(type==='delay')return{...f,status:'verspätet',delay:min,reason};if(type==='gate')return{...f,status:'Gate geändert',gate:reason,reason:'Gate geändert'};if(type==='weather')return{...f,status:'verspätet',delay:(f.delay||0)+min,reason};return f});p.scenarios.push({id:uid(),type,flight,reason,minutes:min,createdAt:new Date().toLocaleString('de-DE')});save()}
function renderInfo(){const p=activePlan();setTitle('Infoseiten','Texte, Hinweise und Bilder für Flüge und öffentliche Informationen.');document.getElementById('info').innerHTML=`<div class="grid cols3">${p.infoPages.map(pg=>`<div class="card"><h3>${esc(pg.title)}</h3>${pg.image?`<img src="${esc(pg.image)}" style="width:100%;border-radius:18px">`:''}<p>${esc(pg.text)}</p><span class="badge">${esc(pg.priority||'normal')}</span>${isAdmin()?`<div class="space"></div><button class="btn red" onclick="deleteInfo('${pg.id}')">Löschen</button>`:''}</div>`).join('')}</div>${isAdmin()?`<div class="space"></div><div class="card"><h3>Infoseite erstellen</h3><div class="formgrid"><input id="infoTitle" class="input" placeholder="Titel"><input id="infoImage" class="input" placeholder="Bild-URL"><select id="infoPriority" class="select"><option>normal</option><option>hoch</option><option>kritisch</option></select><textarea id="infoText" class="textarea wide" placeholder="Text"></textarea><button class="btn primary wide" onclick="addInfo()">Speichern</button></div></div>`:''}`}
function addInfo(){activePlan().infoPages.push({id:uid(),title:infoTitle.value,text:infoText.value,image:infoImage.value,priority:infoPriority.value});save()}function deleteInfo(id){activePlan().infoPages=activePlan().infoPages.filter(x=>x.id!==id);activePlan().flights.forEach(f=>{if(f.infoPageId===id)f.infoPageId=null});save()}
function renderMedia(){if(!isAdmin())return blocked('media');setTitle('Medien / Bilder','Bild-URLs verwalten und später in Flügen, Airlines und Infoseiten einsetzen.');document.getElementById('media').innerHTML=`<div class="card"><h3>Bild hinzufügen</h3><div class="formgrid"><input id="medTitle" class="input" placeholder="Titel"><input id="medUrl" class="input" placeholder="Bild-URL"><button class="btn primary wide" onclick="addMedia()">Speichern</button></div></div><div class="space"></div><div class="grid cols3">${state.media.map(m=>`<div class="card"><h3>${esc(m.title)}</h3><img src="${esc(m.url)}" style="width:100%;height:120px;object-fit:cover;border-radius:16px"><p class="small mono">${esc(m.url)}</p><button class="btn red" onclick="deleteMedia('${m.id}')">Löschen</button></div>`).join('')}</div>`}
function addMedia(){state.media.push({id:uid(),title:medTitle.value,url:medUrl.value});save()}function deleteMedia(id){state.media=state.media.filter(m=>m.id!==id);save()}
function renderMonitor(){if(!isAdmin())return blocked('monitor');setTitle('Monitor-Modus','Große Anzeige für Flughafenbildschirme.');const p=activePlan();document.getElementById('monitor').innerHTML=`<div class="monitor"><div class="row" style="justify-content:space-between"><h2>${esc(p.airport)} · Abflug</h2><strong>${new Date().toLocaleTimeString('de-DE')}</strong></div><table class="table"><thead><tr><th>Zeit</th><th>Airline</th><th>Flug</th><th>Ziel</th><th>Gate</th><th>Status</th></tr></thead><tbody>${dayFlights(p,todayDay(),false).map(f=>`<tr><td style="font-size:24px"><b>${f.time}</b></td><td>${esc(f.airline)}</td><td>${esc(f.flightNo)}</td><td><b>${esc(f.destination)}</b></td><td>${esc(f.gate)}</td><td><span class="status ${statusClass(f.status)}">${esc(f.status)}</span></td></tr>`).join('')}</tbody></table></div><div class="space"></div><button class="btn primary" onclick="document.documentElement.requestFullscreen?.()">Vollbild starten</button>`}
function renderSettings(){if(!isAdmin())return blocked('settings');setTitle('Einstellungen','Passwort ändern, dauerhaft angemeldet bleiben und Systemdaten sichern.');document.getElementById('settings').innerHTML=`<div class="grid cols2"><div class="card"><h3>Passwort ändern</h3><div class="formgrid"><input id="oldPw" class="input" type="password" placeholder="Altes Passwort"><input id="newPw" class="input" type="password" placeholder="Neues Passwort"><input id="newPw2" class="input" type="password" placeholder="Neues Passwort wiederholen"><button class="btn primary wide" onclick="changePassword()">Passwort ändern</button></div><p class="footer-note">Passwort vergessen: Notfallcode 1234 eingeben und neues Passwort setzen. Für echte öffentliche Websites wäre ein fester Code unsicher.</p></div><div class="card"><h3>System</h3><label><input type="checkbox" ${localStorage.getItem(LS+'_remember')==='yes'?'checked':''} onchange="localStorage.setItem(LS+'_remember',this.checked?'yes':'no');renderAll()"> Auf diesem Gerät angemeldet bleiben</label><div class="space"></div><button class="btn" onclick="download('airport-system-backup.json',JSON.stringify(state,null,2))">Alles sichern</button><button class="btn red" onclick="if(confirm('Demo-Daten zurücksetzen?')){localStorage.removeItem(LS);location.reload()}">Zurücksetzen</button></div></div>`}
function changePassword(){if(oldPw.value!==state.password&&oldPw.value!==state.recoveryCode)return alert('Altes Passwort oder Notfallcode falsch.');if(!newPw.value||newPw.value!==newPw2.value)return alert('Neue Passwörter stimmen nicht überein.');state.password=newPw.value;save();alert('Passwort geändert.')}function blocked(id){document.getElementById(id).innerHTML='<div class="danger"><b>Nur nach Login.</b><br>Diese Seite ist geschützt. Öffentliche Bereiche bleiben sichtbar.</div>'}

function openModal(title,body){document.getElementById('modalTitle').innerHTML=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('loginBtn').onclick=()=>openModal('Login',`<div class="formgrid"><input id="loginPw" class="input" type="password" placeholder="Passwort"><label class="wide"><input type="checkbox" id="rememberLogin"> Angemeldet bleiben auf diesem Gerät</label><button class="btn primary wide" onclick="doLogin()">Einloggen</button><div class="notice wide">Passwort vergessen? Notfallcode <b>1234</b> eingeben, danach in Einstellungen neues Passwort setzen.</div></div>`);
document.getElementById('logoutBtn').onclick=()=>{session.loggedIn=false;localStorage.removeItem(LS+'_remember');renderAll();show('home')};
function doLogin(){const pw=document.getElementById('loginPw').value;if(pw===state.password||pw===state.recoveryCode){session.loggedIn=true;if(document.getElementById('rememberLogin').checked)localStorage.setItem(LS+'_remember','yes');closeModal();renderAll()}else alert('Passwort falsch.')}
setInterval(()=>{document.getElementById('clockBadge').textContent=new Date().toLocaleTimeString('de-DE');const p=activePlan();if(p&&document.getElementById('live').classList.contains('active'))renderLive();if(p&&document.getElementById('monitor').classList.contains('active'))renderMonitor()},1000);
setInterval(()=>{if(document.getElementById('live').classList.contains('active'))renderLive()},60000);
renderAll();show('home');
</script>
</body>
</html>
